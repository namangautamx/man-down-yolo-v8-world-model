# ============================================================================
# yw_mandown - configuration template
#
# Copy this to config/config.yaml and edit. Every knob the pipeline uses
# comes from here -- nothing is hardcoded in the scripts.
# ============================================================================

model:
  name: "yolov8m-worldv2.pt"   # or yolov8s-worldv2.pt for a lighter/faster model
  device: "cuda"                 # null = auto (cuda if available), or "cuda", "cpu"
  image_size: 960

prompts:
  positive:
    - "a person lying on the floor"
    - "a person lying on the ground"
    - "a person sleeping"
    - "a person fallen"



  # Distractor classes. These are set as YOLO-World classes so look-alike boxes
  # have somewhere to land, and their detections are then discarded. They can no
  # longer veto a positive -- that mechanism was removed after it fired 39 times
  # on the crash-mat footage, every one from "a mattress", every one a genuine
  # man-down (the model finds the mat *under* the fallen person).
  #
  # Measured over the same 120 frames:
  #   as classes, veto on    16/120 frames detected
  #   as classes, veto off   17/120   <-- what this is now
  #   removed entirely       12/120
  #
  # So keep the list: deleting it costs ~30% of detections. Standing people are
  # rejected by geometry.min_aspect_ratio instead, which is what actually works.
  #
  # !! ADDING CLASSES RESCALES EVERY SCORE. YOLO-World compares a region against
  # the whole class set, so a longer list shifts all confidences up. Adding
  # "dog" and "cat" here took the empty-crash-mat box from 0.15 to 0.35 on the
  # same image, and false positives on pre-fall frames from 1.9% to 24.4%.
  # True positives rose too (37.5% -> 55.8%) purely because everything inflated
  # -- compared at MATCHED false-positive rates the shorter list won every time:
  #     at 2% FP:  4 negatives 37.5% TP  vs  6 negatives 31.7% TP
  #     at 5% FP:  4 negatives 42.5% TP  vs  6 negatives 36.7% TP
  # If you add a class, re-tune conf_threshold and re-measure; do not assume the
  # old threshold still means the same thing.
  negative:
    - "a person standing"
    - "a person walking"
    - "a mattress"
    - "a pile of bags"
    # NOT added here, and the reason is worth keeping:
    #
    # A person on hands and toes -- push-up, plank, crawling, kneeling to pick
    # something up -- is horizontal AND can hold still, so it passes the aspect
    # gate and the stillness gate both. Neither filter touches it. The obvious
    # lever is a distractor class ("a person doing push ups", "a person on hands
    # and knees", "a person crawling").
    #
    # A frame-sampled test said those cost nothing (24/60 -> 25/60 lab frames).
    # That test was too coarse. On the FULL pipeline they cost a real fall:
    # 1bacam3.avi went from 40 alarm frames to 0, taking lab recall 7/8 -> 6/8.
    #
    # So: unverified benefit (no push-up footage exists to test against) for a
    # measured loss of one real fall in eight. Not a trade worth making for a
    # safety system. Revisit only with footage of the actual pose, and re-measure
    # on whole clips, not sampled frames.

  # ----------------------------------------------------------------------
  # Veto classes. These run as a SECOND model pass, only on frames where a
  # detection already survived -- so they cost nothing on quiet frames and,
  # crucially, do NOT rescale the main scores the way prompts.negative does.
  # (Putting "dog"/"cat" in prompts.negative took false positives from 1.9%
  # to 24.4%, because YOLO-World scores a region against the whole class set.)
  #
  # Measured on the mtests footage: "a dog"/"a cat" score 0.75-0.78 on real
  # animals but only 0.25-0.28 on genuinely fallen people. That margin is what
  # makes vetoing safe. Verified: every animal false positive removed, all 25
  # detections on the two fallen construction workers kept, crash-mat footage
  # unchanged (32 -> 32).
  #
  # KEEP THIS LIST NARROW AND CONCRETE. "an animal lying down" scored 0.28 on
  # real fallen workers -- a vague prompt here vetoes real emergencies.
  # Measured on 36 supplied false positives: a chicken scored "a bird" 0.88, a
  # horse scored "a horse" 0.59, both with dog/cat at 0.00 -- they were invisible
  # to a dog/cat-only list. On all four real man-down images every one of these
  # prompts scores 0.00, so widening costs nothing.
  veto:
    - "a dog"
    - "a cat"
    - "a bird"
    - "a chicken"
    - "a horse"
  veto_conf: 0.30              # veto class must score at least this
  veto_iou: 0.30                # ...and overlap the detection this much, OR
  veto_containment: 0.60        # ...sit this far inside it (catches a small
                                #    animal inside a large man-down box)

  conf_threshold: 0.33          # positive detections below this are discarded.
                                # Measured event-level recall on 30 falls (one per
                                # video), i.e. was the fall caught at all:
                                #    0.40 -> 90% of events   (37% of frames)
                                #    0.33 -> 97% of events   (41% of frames)
                                #    0.25 -> 97% of events   (44% of frames)
                                #    0.15 -> 97% of events   (52% of frames)
                                # Below 0.33 buys no extra events, only more
                                # frames per event and more false positives.


# ----------------------------------------------------------------------------
# Geometry gate. A person on the floor projects a WIDE box; a person standing
# projects a TALL one. Measured on the cam1 run: every confirmed standing false
# positive had w/h of 0.41, 0.46 or 0.91, while real man-downs ran 1.2-3.0.
# One of those false positives scored conf 0.55 -- higher than many true ones --
# so confidence alone cannot separate them, but geometry can.
#
# On the crash-mat footage w/h >= 1.0 keeps 92% of true detections.
# Raise toward 1.2 for fewer false alarms, lower to 0 to disable the check.
# ----------------------------------------------------------------------------
geometry:
  min_aspect_ratio: 0.7        # reject positives with box width/height below this

  # A clipped box has a meaningless aspect ratio -- the body continues outside
  # the image. Someone walking towards the camera is cut off at the bottom, so
  # only head and shoulders show: wider than tall, and cam2 scored exactly that
  # 0.97 as "a person lying on the floor" (box [1052,981,1630,1440] in a
  # 1440-tall frame, y2 flush against the border).
  #
  # Measured cost of the rule: zero. It kept 33/33 crash-mat detections and
  # 4/4 on the real fallen workers, while rejecting that false positive.
  #
  #   "bottom" - guards the walking-into-camera case (default)
  #   "any"    - also guards side/top clipping, but may miss someone who has
  #              genuinely fallen half out of view
  #   "none"   - disable
  reject_edge_touching: "bottom"
  edge_margin_px: 3             # treat within this many px of the border as touching

# ----------------------------------------------------------------------------
# ----------------------------------------------------------------------------
# Stillness gate. A detection is held back until it proves it is not moving.
#
# Of 19 false positives that survived every other filter, 14 were people who
# are genuinely not down -- crouching for a bag, kneeling by a car, bending at
# a desk, sitting on a sofa. They scored 0.67, 0.70, 0.84. From a single box,
# crouching and lying are not separable, so no prompt or threshold reaches them.
#
# Time does. Measured drift per inference frame, in box widths:
#     genuinely fallen   0.0009  0.0012  0.0013  0.0015  0.0046
#     walking / active   0.0276  0.0320  0.0373
# Thirty times apart, and normalised by box size so it is independent of
# resolution and distance. Growth is checked too: a person walking INTO the lens
# grew 4-7% of box area per frame, a fallen person 0.2%.
#
# THIS DELAYS EVERY ALARM BY still_seconds. That is the mechanism, not a side
# effect -- you cannot know something is still without watching it. Paid once
# per event, not per frame.
#
# Set enabled: false to go back to alarming the instant a box appears.
# ----------------------------------------------------------------------------
stillness:
  enabled: true
  still_seconds: 6.0            # how long a box must hold position before alarming.
                                # Swept on real footage: 3.0s lost 4/4 of the
                                # harder lab falls, 2.0s kept 3/4, and the
                                # walking-into-lens false positive stayed at
                                # zero alarms at every value tested.
  max_drift: 0.06               # centroid movement per inference frame, in box widths.
                                # Deliberately loose. Someone conscious and in
                                # pain moves -- an arm, a shoulder, a head turn --
                                # during the countdown, and a tight value would
                                # restart the clock on exactly the casualty this
                                # exists to find. Measured separation is wide
                                # enough to afford it: fallen 0.0009-0.0046,
                                # walking 0.0276-0.0373.
  max_growth: 0.08              # box area change per inference frame, same
                                # reasoning -- a body shifting on the floor
                                # changes its box area without going anywhere.
  match_iou: 0.30               # IoU needed to call it the same box next frame
  track_timeout_seconds: 2.0    # forget a track unseen for this long

  # The rule is MEDIAN drift over the sightings, not a count of "still" frames:
  # counting flags gave a still-ratio of 0.58 on real falls and lost 7 of 8,
  # because the wobble is concentrated in a minority of frames.
  min_observations: 4           # never confirm on fewer sightings than this.
                                # still_seconds is ELAPSED time, not detected
                                # frames -- the detector fired on only 91 of 781
                                # frames on lab footage while the person lay
                                # there the whole time.

# ----------------------------------------------------------------------------
# Temporal confirmation. Counted in INFERENCE frames, so with frame_skip: 2
# these are half as many video frames again.
#
# Before this existed the cam1 run produced 158 detected frames scattered over
# 29 separate runs, 13 of them one frame long -- that flicker is what "not
# continuous" looked like on screen.
# ----------------------------------------------------------------------------
temporal:
  enabled: true
  confirm_frames: 3             # need this many detections...
  window_frames: 6              # ...within this many recent inference frames
  hold_frames: 15               # keep the alarm up this many empty frames before dropping

processing:
  frame_skip: 2                 # run inference on every Nth frame; display/clips still get every frame

output:
  base_folder: "./output_hvsampel"       # frames/<source_id>/ and clips/<source_id>/ live under here
  save_frames: true             # save the WHOLE annotated frame, not a crop of the box
  save_clips: true
  clip_pre_seconds: 3.0         # seconds of rolling buffer written before the trigger frame
  clip_post_seconds: 3.0        # seconds kept recording after the last detection
  frame_min_interval_seconds: 1.0  # don't save a frame more than once per this many seconds

display:
  show_window: true             # one source -> its own window; several -> see layout below
  layout: "separate"            # one window per camera; "grid" puts them all in one
  fit_to_screen: true           # scale the window down to your display (never scales up)
  screen_margin: 0.9            # use at most this fraction of the screen
  max_width: null               # set BOTH to pin an exact window size and ignore the screen
  max_height: null
  window_name: "MAN-DOWN DETECTION"
  # Yellow = passed the filters but NOT confirmed; the label carries the numbers
  # that decide it (conf, w/h, area %, stillness progress, median drift).
  # Red = confirmed man-down. Only red is logged to events.jsonl and saved as a
  # frame -- a yellow box is a candidate under evaluation, not evidence.
  # Set false for a clean picture with confirmed alarms only.
  show_candidates: true

logging:
  events_path: "./logs/events.jsonl"

